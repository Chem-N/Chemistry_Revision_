<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game 2: Formula of Ions</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@700&display=swap" rel="stylesheet">
    <!-- Link to the single, universal stylesheet -->
    <link rel="stylesheet" href="../../styles.css">
</head>
<body class="theme-blue">

    <div class="app-container">
        
        <!-- ===== View 1: Main Game Menu ===== -->
        <div id="view-game2-menu" class="view active">
            <button class="header-icon-btn corner-btn mute-btn" id="main-menu-mute-btn"></button>
            <div class="game-menu-content">
                <h1 class="menu-title">Formula of Ions 🧪</h1>
                <p class="menu-subtitle">HKDSE Chemistry</p>
                <button id="goto-mode-select-btn" class="menu-button">Start Revision</button>
                <a href="../../index.html" class="menu-button tertiary">Back to Platform</a>
            </div>
        </div>

        <!-- ===== View 2: Mode Selection ===== -->
        <div id="view-mode-select" class="view">
            <header class="game-header">
                <button class="header-icon-btn back-to-main-menu">
                     <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 18L9 12L15 6" stroke="var(--primary-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <h2 class="header-title">Select Mode</h2>
                <button class="header-icon-btn corner-btn mute-btn" id="mode-select-mute-btn"></button>
            </header>
            <div class="game-content">
                <button id="start-cation-mc-btn" class="menu-button">Cation Revision (MC)</button>
                <button id="start-anion-mc-btn" class="menu-button">Anion Revision (MC)</button>
                <button id="start-input-btn" class="menu-button">Ion Revision (input)</button>
                <button class="menu-button" disabled>Challenge Mode</button>
            </div>
        </div>

        <!-- ===== View 3: Game View (Multiple Choice) ===== -->
        <div id="view-game-mc" class="view">
             <header class="game-header">
                <button class="header-icon-btn back-to-mode-select">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 18L9 12L15 6" stroke="var(--primary-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <h2 id="mc-mode-title" class="header-title">Revision</h2>
                <button class="header-icon-btn corner-btn mute-btn" id="mc-game-mute-btn"></button>
            </header>
            <div class="game-stats">
                <div>Score: <span id="mc-score-value" class="stat-value">0</span></div>
            </div>
            <main class="game-content">
                <div class="ion-card compact">
                    <h3 id="mc-ion-name" class="ion-name">Sodium ion</h3>
                </div>
                <div id="mc-answer-options" class="answer-buttons">
                    <!-- MC Answer buttons generated by JS -->
                </div>
                <div id="mc-feedback-area" class="feedback-area">Choose an answer to begin.</div>
                <button id="mc-end-revision-btn" class="secondary-action-btn">End Revision</button>
            </main>
        </div>
        
        <!-- ===== View 4: Game View (Input Mode) ===== -->
        <div id="view-game-input" class="view">
            <header class="game-header">
                 <button class="header-icon-btn back-to-mode-select">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 18L9 12L15 6" stroke="var(--primary-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <h2 class="header-title">Ion Revision (Input)</h2>
                <button class="header-icon-btn corner-btn mute-btn" id="input-game-mute-btn"></button>
            </header>
            <!-- MODIFICATION: Added score display -->
            <div class="game-stats">
                <div>Score: <span id="input-score-value" class="stat-value">0</span></div>
            </div>
            <main class="game-content" style="justify-content: flex-start; padding-top: 0;">
                <div class="interaction-row">
                <div class="ion-card compact">
                    <p class="ion-name" id="input-ion-name">Permanganate ion</p>
                </div>

                <div class="input-display-area">
                    <div class="formula-display" id="input-formula-display"></div>
                </div>
                </div>
                <div id="input-keyboard" class="keyboard">
                    <!-- Keyboard buttons will be generated by JavaScript -->
                </div>
                
                <div id="input-feedback-area" class="feedback"></div>

                <div class="action-buttons">
                    <button class="action-btn next-btn" id="input-next-question-btn">Next</button>
                    <button class="action-btn submit-btn" id="input-submit-btn">Submit</button>
                </div>
                <!-- MODIFICATION: Added End Revision button -->
                <button id="input-end-revision-btn" class="secondary-action-btn">End Revision</button>
            </main>
        </div>


        <!-- ===== View 5: End Screen ===== -->
        <div id="view-end-screen" class="view">
             <div class="game-menu-content">
                <h2 id="end-title" class="end-title">Complete! 🏆</h2>
                <p class="end-score-label">Your Final Score</p>
                <p id="final-score" class="end-score-value">0</p>
                <button id="play-again-btn" class="menu-button">Play Again</button>
                <button id="main-menu-btn" class="menu-button secondary">Back to Menu</button>
            </div>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
