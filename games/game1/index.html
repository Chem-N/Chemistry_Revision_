<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game 1: Colour of Ions</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@700&display=swap" rel="stylesheet">
    <!-- Link to the single, universal stylesheet -->
    <link rel="stylesheet" href="../../styles.css">
</head>
<body class="theme-orange">

    <div class="app-container">
        
        <!-- ===== View 1: Main Menu ===== -->
        <div id="main-menu-view" class="view active">
            <button id="main-menu-mute-btn" class="header-icon-btn corner-btn"></button>
            <div class="game-menu-content">
                <h1 class="menu-title">Colour of Ions 🎨</h1>
                <p class="menu-subtitle">HKDSE Chemistry</p>
                <button id="revision-btn" class="menu-button">Revision Mode</button>
                <button id="challenge-btn" class="menu-button">Challenge Mode</button>
                <a href="../../index.html" class="menu-button tertiary">Back to Platform</a>
            </div>
        </div>

        <!-- ===== View 2: Game View ===== -->
        <div id="game-view" class="view">
             <header class="game-header">
                <button class="header-icon-btn back-button">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 18L9 12L15 6" stroke="#ff8c42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <h2 id="mode-title" class="header-title">Revision Mode</h2>
                <button id="game-mute-btn" class="header-icon-btn corner-btn"></button>
            </header>
            <div class="game-stats">
                <div id="score-display">Score: <span id="score-value" class="stat-value">0</span></div>
                <div id="question-counter-display" style="display: none;">Question: <span id="question-counter-value" class="stat-value">0/0</span></div>
            </div>
            <main class="game-content">
                <div class="ion-card">
                    <h3 id="ion-name" class="ion-name chemical-formula">Cu²⁺(aq)</h3>
                </div>
                <div id="answer-options" class="answer-buttons">
                    <!-- Answer buttons generated by JS -->
                </div>
                <div id="feedback-area" class="feedback-area">Choose an answer to begin.</div>
                 <button id="end-revision-btn" class="secondary-action-btn">End Revision</button>
            </main>
        </div>

        <!-- ===== View 3: End Screen ===== -->
        <div id="end-screen-view" class="view">
             <div class="game-menu-content">
                <h2 id="end-title" class="end-title">Complete! 🏆</h2>
                <p class="end-score-label">Your Final Score</p>
                <p id="final-score" class="end-score-value">0</p>
                <button id="play-again-btn" class="menu-button">Play Again</button>
                <button id="main-menu-btn" class="menu-button secondary">Back to Menu</button>
            </div>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
